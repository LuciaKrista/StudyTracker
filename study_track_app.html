<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Track - Lucia</title>
<style>
  :root{
    --bg:#0b0d17; --card:rgba(255,255,255,.05); --card-solid:#151827; --text:#e8eaf6; --muted:#8b90a8;
    --border:rgba(255,255,255,.09); --accent:#6366f1; --accent2:#8b5cf6; --accent-soft:rgba(99,102,241,.14);
    --good:#34d399; --warn:#fbbf24; --bad:#f87171;
    --glow:0 0 24px rgba(99,102,241,.35);
    --shadow:0 8px 32px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}
  body::before{width:520px;height:520px;background:#4338ca;top:-140px;left:-120px;animation:float1 22s ease-in-out infinite alternate}
  body::after{width:460px;height:460px;background:#0d9488;bottom:-160px;right:-100px;animation:float2 26s ease-in-out infinite alternate}
  @keyframes float1{from{transform:translate(0,0)}to{transform:translate(120px,80px)}}
  @keyframes float2{from{transform:translate(0,0)}to{transform:translate(-100px,-70px)}}
  #app{display:flex;min-height:100vh}
  nav{width:210px;background:rgba(255,255,255,.04);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;backdrop-filter:blur(14px)}
  .logo{font-weight:800;font-size:18px;padding:6px 10px 16px;background:linear-gradient(90deg,#a5b4fc,#67e8f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
  nav button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:transparent;border-radius:10px;font-size:14px;cursor:pointer;color:var(--muted);transition:all .2s ease}
  nav button:hover{background:var(--accent-soft);color:var(--text);transform:translateX(4px)}
  nav button.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:600;box-shadow:var(--glow);transform:none}
  .side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border);padding-top:10px}
  .side-bottom button{font-size:13px;color:var(--muted)}
  .syncwrap{max-width:520px}
  .syncrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .syncstat{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
  .syncstat.ok{color:var(--positive)}
  .syncstat.err{color:var(--negative)}
  main{flex:1;padding:24px;max-width:1100px}
  main>*{animation:fadeUp .4s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;animation:fadeUp .4s ease both}
  .card:hover{transform:translateY(-3px);border-color:rgba(129,140,248,.45);box-shadow:0 10px 36px rgba(99,102,241,.22)}
  .card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}.card:nth-child(6){animation-delay:.25s}
  .card .k{font-size:12px;color:var(--muted);margin-bottom:6px}
  .card .v{font-size:26px;font-weight:800;background:linear-gradient(90deg,#c7d2fe,#67e8f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .card .n{font-size:12px;color:var(--muted);margin-top:2px}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:border-color .2s ease}
  .panel:hover{border-color:rgba(129,140,248,.3)}
  .panel h3{margin:0 0 12px;font-size:15px}
  .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#6366f1,#a78bfa);animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{width:0 !important}}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row .name{width:150px;font-size:13px;font-weight:600;flex-shrink:0}
  .row .meta{font-size:12px;color:var(--muted);width:110px;text-align:right;flex-shrink:0}
  .row .bar{flex:1}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
  .pill.week{background:linear-gradient(135deg,#f59e0b33,#f59e0b55);color:#fcd34d;border:1px solid #f59e0b44}
  .pill.soon{background:linear-gradient(135deg,#3b82f633,#3b82f655);color:#93c5fd;border:1px solid #3b82f644}
  .pill.later{background:rgba(255,255,255,.06);color:#cbd5e1;border:1px solid var(--border)}
  .pill.overdue{background:linear-gradient(135deg,#ef444433,#ef444455);color:#fca5a5;border:1px solid #ef444444;animation:pulse 1.6s ease-in-out infinite}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr,table tr:not(:first-child){transition:background .15s ease}
  table tr:not(:first-child):hover{background:rgba(255,255,255,.03)}
  .btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s ease;box-shadow:0 2px 10px rgba(99,102,241,.25)}
  .btn:hover{transform:translateY(-2px);box-shadow:var(--glow)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn.secondary{background:var(--accent-soft);color:#a5b4fc;border:1px solid rgba(99,102,241,.3);box-shadow:none}
  .btn.secondary:hover{background:rgba(99,102,241,.22);box-shadow:0 2px 14px rgba(99,102,241,.2)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);box-shadow:none}
  .btn.ghost:hover{border-color:rgba(129,140,248,.4);color:var(--text);box-shadow:none}
  .btn:disabled{opacity:.45;cursor:default}
  input,select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:rgba(255,255,255,.06);color:var(--text);transition:border-color .2s ease,box-shadow .2s ease}
  input:focus,select:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.25)}
  select option{background:#151827;color:var(--text)}
  input[type="date"]::-webkit-calendar-picker-indicator,input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(.7)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
  .form>div{display:flex;flex-direction:column}
  .timer-display{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0;background:linear-gradient(90deg,#c7d2fe,#67e8f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(99,102,241,.35))}
  .timer-phase{text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
  .timer-btns{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
  .weekhead{display:grid;grid-template-columns:60px repeat(7,1fr);gap:6px;margin-bottom:6px}
  .weekhead .d{text-align:center;font-size:12px;color:var(--muted)}
  .weekhead .d b{display:block;color:var(--text);font-size:14px}
  .weekhead .d.today{color:#a5b4fc;text-shadow:0 0 12px rgba(99,102,241,.6)}
  .pgrid{display:grid;position:relative;grid-template-columns:60px repeat(7,1fr);grid-auto-rows:34px;gap:6px}
  .babs{position:absolute;left:1px;right:1px;pointer-events:none}
  .babs .block{pointer-events:auto;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start}
  .daycol{position:relative;pointer-events:none;grid-column:span 1}
  .bslot{position:relative;z-index:2;display:flex;flex-direction:column;pointer-events:none;padding-right:2px}
  .modal-overlay{position:fixed;inset:0;background:rgba(8,10,20,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:60;animation:fadeIn .2s ease both}
  .modal{background:rgba(21,24,39,.92);border:1px solid rgba(129,140,248,.25);border-radius:16px;padding:20px;width:min(480px,92vw);max-height:86vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5),var(--glow);animation:popIn .25s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(18px)}
  body.light .modal{background:rgba(255,255,255,.95)}
  .modal h3{margin:0 0 14px}
  .dcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:border-color .2s ease}
  .dcard:hover{border-color:rgba(129,140,248,.3)}
  .dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dhead b{font-size:14px}
  .dmeta{font-size:12px;color:var(--muted);margin-left:auto}
  .ddesc{font-size:13px;color:var(--muted);margin:8px 0;line-height:1.45}
  .dchkhead{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:10px}
  .check-row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .check-row input{flex:1;padding:6px 10px;font-size:12px}
  .ckbox{width:18px;height:18px;border:1.5px solid var(--border);border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:all .15s ease;color:#fff}
  .ckbox:hover{border-color:#6366f1}
  .ckbox.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent}
  .cktext{flex:1;font-size:13px;cursor:text;border-radius:6px;padding:2px 6px;transition:background .15s ease}
  .cktext:hover{background:rgba(255,255,255,.06)}
  .cktext.done{opacity:.55;text-decoration:line-through}
  .cknum{font-size:11px;color:var(--muted);width:18px;text-align:right;flex-shrink:0}
  .cktarget{flex:0 0 58px;padding:4px 4px;font-size:11px;text-align:center}
  .pill.mini{font-size:10px;padding:2px 7px;flex-shrink:0}
  .ckedit{flex:1;padding:4px 8px;font-size:13px}
  .ckarrow{cursor:pointer;color:var(--muted);font-size:11px;padding:0 2px;user-select:none;transition:color .15s ease}
  .ckarrow:hover{color:var(--text)}
  .today-block{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);margin:6px 0;background:rgba(255,255,255,.04);cursor:pointer;transition:all .15s ease}
  .today-block:hover{border-color:rgba(129,140,248,.4);transform:translateX(3px)}
  .today-block.done{opacity:.5}
  .today-block.done .tb-act{text-decoration:line-through}
  .tb-time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;width:92px;flex-shrink:0}
  .tb-main{flex:1;min-width:0}
  .tb-act{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-ck{width:22px;height:22px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .15s ease}
  .tb-ck:hover{border-color:#6366f1}
  .tb-ck.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent}
  .step-src{font-size:11px;color:var(--muted);margin:10px 0 2px;display:flex;align-items:center;gap:6px}
  .step-src b{color:var(--text);font-size:12px}
  .wkrow{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
  .wkd{font-size:12px;color:var(--muted);width:104px;flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums}
  .wkcard{flex:1;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(12px)}
  .wkcard.cur{border-color:rgba(129,140,248,.55);box-shadow:0 0 20px rgba(99,102,241,.25)}
  .wkcard .lt{font-size:13px;font-weight:700;margin-bottom:2px}
  .wkcard .prep{font-size:12px;color:var(--muted);margin:2px 0}
  .ntree{font-size:13px}
  .nfolder{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s ease;font-weight:600}
  .nfolder:hover{background:rgba(255,255,255,.05)}
  .nfolder .arrow{transition:transform .2s ease;font-size:11px;color:var(--muted);width:12px}
  .nfolder.open .arrow{transform:rotate(90deg)}
  .nsub{margin-left:26px;border-left:1px solid var(--border);padding-left:8px}
  .nsubfold{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--muted);transition:all .15s ease}
  .nsubfold:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .nsubfold.open{color:var(--text)}
  .nsubfold .arrow{font-size:10px;width:10px;transition:transform .2s ease}
  .nsubfold.open .arrow{transform:rotate(90deg)}
  .neditor{margin:8px 0 4px 40px}
  .neditor textarea{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
  .nmeta{font-size:11px;color:var(--muted);margin-top:4px}
  .nsearch-result{padding:8px 10px;border-radius:8px;border:1px solid var(--border);margin:6px 0;cursor:pointer;transition:all .15s ease;background:var(--card)}
  .nsearch-result:hover{border-color:rgba(129,140,248,.4)}
  .nsr-src{font-size:11px;color:var(--muted);margin-bottom:3px}
  .nsr-text{font-size:13px;line-height:1.4}
  .nsr-text mark{background:rgba(251,191,36,.35);color:#fde68a;border-radius:3px;padding:0 2px}
  body.light .nsr-text mark{color:#92400e}
  .cgroup{margin:20px 0 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
  textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:rgba(255,255,255,.06);color:var(--text);min-height:72px;resize:vertical;font-family:inherit;width:100%;transition:border-color .2s ease,box-shadow .2s ease}
  textarea:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.25)}
  .bslot .block{min-height:26px;pointer-events:auto;overflow:hidden}
  .phour{font-size:11px;color:var(--muted);text-align:right;padding:2px 4px}
  .pcell{min-height:34px;border:1px dashed rgba(255,255,255,.12);border-radius:8px;padding:2px;cursor:pointer;transition:all .15s ease}
  .pcell:hover{border-color:#6366f1;background:var(--accent-soft);transform:scale(1.03)}
  .block{border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.3;margin-bottom:3px;color:#fff;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .15s ease}
  .block:hover{transform:scale(1.03)}
  .block small{display:block;opacity:.85;font-size:10px}
  .block.done{opacity:.5;text-decoration:line-through}
  .block .x{position:absolute;top:1px;right:3px;cursor:pointer;font-size:11px;opacity:.8}
  .block .x:hover{opacity:1;transform:scale(1.2)}
  .swatch{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:6px;box-shadow:0 0 8px currentColor}
  .empty{color:var(--muted);font-size:13px;padding:12px;text-align:center}
  canvas{max-width:100%}
  .navbtns{display:flex;gap:8px;margin-bottom:12px}
  .session-list{font-size:13px}
  .session-list .row{margin:4px 0}
  .del{cursor:pointer;color:var(--muted);font-size:14px;transition:all .15s ease}
  .del:hover{color:var(--bad);transform:scale(1.25)}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(129,140,248,.5)}
  ::selection{background:rgba(99,102,241,.4)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  @media(max-width:760px){nav{width:64px;padding:12px 6px}.logo{font-size:0;padding:6px 0 14px;text-align:center}.logo::before{content:"ST";font-size:16px;-webkit-text-fill-color:initial;background:none;color:#a5b4fc}nav button{font-size:0;padding:10px 6px;text-align:center}nav button::after{font-size:11px;display:block}#nav-today::after{content:"Now"}#nav-week::after{content:"Week"}#nav-rooster::after{content:"Rooster"}#nav-dashboard::after{content:"Home"}#nav-planner::after{content:"Plan"}#nav-timer::after{content:"Timer"}#nav-deadlines::after{content:"Due"}#nav-xams::after{content:"Exam"}#nav-courses::after{content:"Course"}#nav-notes::after{content:"Notes"}#btn-export::after{content:"Share"}#btn-sync::after{content:"Sync"}#btn-import::after{content:"In"}#btn-reset::after{content:"Reset"}main{padding:14px}}

  .timer-wrap{position:relative;width:250px;margin:12px auto}
  .ringsvg{width:100%;display:block;transform:rotate(-90deg)}
  .ringsvg circle{fill:none;stroke-width:10;stroke-linecap:round}
  .ring-bg{stroke:rgba(255,255,255,.08)}
  .ring-fg{stroke:url(#ringGrad);stroke-dasharray:628.3;stroke-dashoffset:628.3;transition:stroke-dashoffset .4s linear;filter:drop-shadow(0 0 8px rgba(99,102,241,.55))}
  .timer-display{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;margin:0}
  .confetti{position:fixed;width:8px;height:13px;border-radius:2px;z-index:99;pointer-events:none;animation:confetti-burst 1s ease-out forwards}
  @keyframes confetti-burst{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 150px)) rotate(var(--rot)) scale(.6);opacity:0}}
  body.light{--bg:#eef1f9;--card:#ffffff;--text:#1e2233;--muted:#646a84;--border:rgba(20,24,50,.12);--accent-soft:rgba(99,102,241,.1);--shadow:0 8px 24px rgba(30,34,60,.08);--glow:0 0 20px rgba(99,102,241,.25)}
  body.light::before,body.light::after{opacity:.16}
  body.light nav{background:rgba(255,255,255,.75)}
  body.light .card .v,body.light .timer-display{background:linear-gradient(90deg,#4338ca,#0891b2);-webkit-background-clip:text;background-clip:text}
  body.light .ring-bg{stroke:rgba(20,24,50,.1)}
  body.light table tr:not(:first-child):hover{background:rgba(20,24,50,.03)}
  body.light select option{background:#fff;color:#1e2233}
  body.light input[type="date"]::-webkit-calendar-picker-indicator,body.light input[type="time"]::-webkit-calendar-picker-indicator{filter:none}
  body.light .pcell{border-color:rgba(20,24,50,.15)}
  body.light .pill.later{background:rgba(20,24,50,.05);color:#475569}
  @media(max-width:760px){#btn-theme::after{content:"Theme"}}
</style>
</head>
<body>
<div id="app">
  <nav>
    <div class="logo">Study Track <span style="font-size:10px;vertical-align:super;opacity:.55">v3</span></div>
    <button id="nav-today" onclick="go('today')">Today</button>
    <button id="nav-week" onclick="go('week')">Weekplan</button>
    <button id="nav-rooster" onclick="go('rooster')">Rooster</button>
    <button id="nav-dashboard" onclick="go('dashboard')">Dashboard</button>
    <button id="nav-planner" onclick="go('planner')">Planner</button>
    <button id="nav-timer" onclick="go('timer')">Timer</button>
    <button id="nav-deadlines" onclick="go('deadlines')">Deadlines</button>
    <button id="nav-xams" onclick="go('xams')">Exams &amp; Assignments</button>
    <button id="nav-courses" onclick="go('courses')">Courses</button>
    <button id="nav-notes" onclick="go('notes')">Notes</button>
    <button id="nav-sync" onclick="go('sync')">Sync</button>
    <div class="side-bottom">
      <button id="btn-export" onclick="exportData()">Backup delen</button>
      <button id="btn-sync" onclick="go('sync')">Sync</button>
    <button id="btn-import" onclick="document.getElementById('import-file').click()">Import</button>
      <button id="btn-reset" onclick="resetData()">Reset</button>
      <button id="btn-theme" onclick="toggleTheme()">Theme</button>

function save(){try{state.lastModified=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}

function uid(){return "x"+(state.seq++);}
function course(id){return state.courses.find(c=>c.id===id);}

function minutesOn(date){return state.sessions.filter(s=>s.date===date).reduce((a,s)=>a+s.minutes,0);}
function sessionsOn(date){return state.sessions.filter(s=>s.date===date);}
function weekHours(mon){let m=0;for(let i=0;i<7;i++)m+=minutesOn(addDays(mon,i));return m;}
function currentStreak(){
  const t=todayStr();let start=minutesOn(t)>0?t:addDays(t,-1),n=0,d=start;
  while(minutesOn(d)>0){n++;d=addDays(d,-1);}return n;}
function longestStreak(){
  if(!state.sessions.length)return 0;
  const days=[...new Set(state.sessions.map(s=>s.date))].sort();
  let best=1,run=1;
  for(let i=1;i<days.length;i++){run=(addDays(days[i-1],1)===days[i])?run+1:1;best=Math.max(best,run);}return best;}
function xp(){return Math.round(state.sessions.reduce((a,s)=>a+s.minutes,0)/10);}

function go(v){view=v;["today","week","rooster","notes","sync","dashboard","planner","timer","deadlines","xams","courses"].forEach(x=>{const b=document.getElementById("nav-"+x);if(b)b.classList.toggle("active",x===v);});render();}

function stat(k,v,n){return '<div class="card"><div class="k">'+k+'</div><div class="v">'+v+'</div>'+(n?'<div class="n">'+n+'</div>':'')+'</div>';}

function render(){
  const main=document.querySelector("main");
  let h="";
  if(view==="today")h=renderToday();
  else if(view==="week")h=renderWeek();
  else if(view==="rooster")h=renderRooster();
  else if(view==="dashboard")h=renderDashboard();
  else if(view==="planner")h=renderPlanner();
  else if(view==="timer")h=renderTimer();
  else if(view==="deadlines")h=renderDeadlines();
  else if(view==="xams")h=renderXams();

}

function weekNumOf(t){
  const m=mondayOf(t);
  const i=WEEKMONDAYS.indexOf(m);
  if(i>=0)return i+1;
  const n=parseD(t),base=parseD(WEEKMONDAYS[0]);
  let diff=Math.floor((n-base)/(7*86400000))+1;
  if(n>=parseD(KERST[0])&&n<=parseD(KERST[1]))diff+=2;
  return diff;
}
function weekDates(n){
  const m=WEEKMONDAYS[n-1];

function hl(text,q){

  if(i<0)return esc(text);
  const st=Math.max(0,i-40),en=Math.min(text.length,i+q.length+60);
  return (st>0?"...":"")+esc(text.slice(st,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length,en))+(en<text.length?"...":"");
}

function renderTimer(){
  const t=todayStr();
  let h='<h1>Focus timer</h1><div class="sub">Pomodoro sessions log automatically; stopwatch logs when you stop</div>';
  h+='<div class="grid2"><div class="panel"><div class="form">'+

    '<div><label>Activity</label><input id="t-act" placeholder="What are you working on?" size="24"></div>'+
    '<div><label>Mode</label><select id="t-mode" onchange="setMode(this.value)"><option value="pomodoro">Pomodoro 25/5</option><option value="deep">Deep 50/10</option><option value="stopwatch">Stopwatch</option></select></div>'+
    '</div><div class="timer-phase" id="t-phase">'+(timer.mode==="stopwatch"?"Stopwatch":(timer.phase==="work"?"Focus session":"Break"))+'</div>'+
    '<div class="timer-wrap"><svg viewBox="0 0 220 220" class="ringsvg"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs><circle class="ring-bg" cx="110" cy="110" r="100"></circle><circle class="ring-fg" id="t-ring" cx="110" cy="110" r="100"></circle></svg><div class="timer-display" id="t-display">'+fmtTimer(timer.mode==="stopwatch"?timer.elapsed:timer.remain)+'</div></div>'+
    '<div class="timer-btns"><button class="btn" id="t-go" onclick="timerStart()">'+(timer.running?"Pause":"Start")+'</button>'+
    '<button class="btn secondary" onclick="timerStopLog()">Stop &amp; log</button>'+
    '<button class="btn ghost" onclick="timerReset()">Reset</button></div></div>';
  h+='<div class="panel"><h3>Log a past session</h3><div class="form">'+
    '<div><label>Date</label><input type="date" id="m-date" value="'+t+'"></div>'+
    '<div><label>Start</label><input type="time" id="m-start" value="14:00"></div>'+
    '<div><label>End</label><input type="time" id="m-end" value="15:30"></div>'+
    '<div><label>Course</label><select id="m-course">'+state.courses.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join("")+'</select></div>'+
    '<div><label>Activity</label><input id="m-act" size="16"></div>'+
    '<button class="btn secondary" onclick="addManual()">Log</button></div></div></div>';
  h+='<div class="panel"><h3>Sessions today ('+(minutesOn(t)/60).toFixed(1)+' h)</h3><div class="session-list">';
  const ss=sessionsOn(t);
  if(!ss.length)h+='<div class="empty">Nothing logged yet today.</div>';
  ss.forEach(s=>{const c=course(s.courseId);
    h+='<div class="row"><span class="swatch" style="background:'+c.color+'"></span><div class="name">'+c.name+'</div><div style="flex:1">'+s.activity+' <span style="color:var(--muted)">('+s.type+')</span></div><div class="meta">'+s.minutes+' min</div><span class="del" onclick="delItem(\'sessions\',\''+s.id+'\')">✕</span></div>';
  });
  return h+"</div></div>";
}
function fmtTimer(s){const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}
function setMode(m){timer.mode=m;timerReset();}
function timerReset(){timer.running=false;clearInterval(timer.int);timer.phase="work";timer.elapsed=0;timer.remain=(timer.mode==="deep"?50:25)*60;if(view==="timer")render();}
function timerStart(){
  timer.running=!timer.running;
  document.getElementById("t-go").textContent=timer.running?"Pause":"Start";
  if(timer.running){timer.int=setInterval(tick,1000);}else clearInterval(timer.int);
}
function tick(){
  if(timer.mode==="stopwatch"){timer.elapsed++;}
  else{timer.remain--;if(timer.remain<=0){
    if(timer.phase==="work"){logSession(25,"Pomodoro");timer.phase="break";timer.remain=(timer.mode==="deep"?10:5)*60;alert("Session logged! Take a break.");}
    else{timer.phase="work";timer.remain=(timer.mode==="deep"?50:25)*60;alert("Break over. Back to focus.");}
  }}
  const el=document.getElementById("t-display");if(el)el.textContent=fmtTimer(timer.mode==="stopwatch"?timer.elapsed:timer.remain);
  const ring=document.getElementById("t-ring");
  if(ring){const total=timer.mode==="stopwatch"?25*60:(timer.mode==="deep"?50:25)*60;
    const cur=timer.mode==="stopwatch"?timer.elapsed:(total-timer.remain);
    const frac=Math.max(0,Math.min(1,cur/total));
    ring.style.strokeDashoffset=String(628.3*(1-frac));}
  const ph=document.getElementById("t-phase");if(ph)ph.textContent=timer.mode==="stopwatch"?"Stopwatch":(timer.phase==="work"?"Focus session":"Break");
}
function timerStopLog(){
  const m=Math.max(1,Math.round((timer.mode==="stopwatch"?timer.elapsed:((timer.mode==="deep"?50:25)*60-timer.remain))/60));
  if(timer.mode!=="stopwatch"&&(timer.phase!=="work"||m<1)){alert("Nothing to log yet.");return;}
  logSession(m,timer.mode==="stopwatch"?"Regular":timer.mode==="deep"?"Deep":"Pomodoro");
  timerReset();alert("Logged "+m+" min.");
}
function logSession(min,type){
  const c=document.getElementById("t-course"),a=document.getElementById("t-act");
  if(!c||!c.value){alert("Pick a course first.");return;}
  state.sessions.push({id:uid(),date:todayStr(),courseId:c.value,activity:a.value.trim()||c.name+" study",minutes:min,type});save();
}

function deadlineCard(d,c){
  const col=c?c.color:"#64748b";
  const dl=Math.round((parseD(d.date)-parseD(todayStr()))/86400000),u=urgency(dl);
  const total=d.materials.length,done=d.materials.filter(m=>m.done).length;
  let h='<div class="dcard" id="dc-'+d.id+'"><div class="dhead"><span class="pill '+u+'">'+urgencyLabel(u)+'</span><b>'+esc(d.title)+'</b><span class="pill later">'+d.type+'</span><span class="dmeta">'+dLabel(d.date)+' · '+dl+' days</span><span class="del" onclick="openDeadline(\''+d.id+'\')" title="Edit details">✎</span><span class="del" onclick="delItem(\'deadlines\',\''+d.id+'\')">✕</span></div>';
  if(d.desc)h+='<div class="ddesc">'+esc(d.desc)+'</div>';
  h+='<div class="dchkhead"><span>'+(d.type==="Exam"?"Exam materials & learning goals":"What needs to be done")+'</span><span>'+done+'/'+total+'</span></div>';
  h+='<div class="bar" style="height:6px;margin:4px 0 6px"><span style="width:'+(total?Math.round(done/total*100):0)+'%;background:'+col+'"></span></div>';
  d.materials.forEach((m,mi)=>{
    const editing=(editMaterialId===m.id);
    h+='<div class="check-row"><span class="cknum">'+(mi+1)+'.</span><span class="ckbox'+(m.done?" on":"")+'" onclick="toggleMaterial(\''+d.id+'\',\''+m.id+'\',this)">'+(m.done?"✓":"")+'</span>';
    if(editing){
      h+='<input class="ckedit cktarget" id="ct-'+m.id+'" value="'+esc(m.target||"")+'" placeholder="wk 2.5" title="Streeftermijn (bijv. week 2.5)">';
      h+='<input class="ckedit" id="ce-'+m.id+'" value="'+esc(m.text)+'" onkeydown="if(event.key===\'Enter\')saveMaterialEdit(\''+d.id+'\',\''+m.id+'\');if(event.key===\'Escape\')cancelMaterialEdit()" onblur="saveMaterialEdit(\''+d.id+'\',\''+m.id+'\')">';
    }else{
      if(m.target)h+='<span class="pill later mini" title="Streeftermijn">'+esc(m.target)+'</span>';
      h+='<span class="cktext'+(m.done?" done":"")+'" title="Click to edit this step" onclick="editMaterial(\''+m.id+'\')">'+esc(m.text)+'</span>';
    }

  h+='</div>';
  return h;

function toggleMaterial(did,mid,el){
  const d=state.deadlines.find(x=>x.id===did);if(!d)return;
  const m=d.materials.find(x=>x.id===mid);if(!m)return;
  const wasAll=d.materials.every(x=>x.done);
  m.done=!m.done;save();
  const allNow=d.materials.length&&d.materials.every(x=>x.done);
  if(allNow&&!wasAll)confetti(el);
  render();
}

function saveMaterialEdit(did,mid){
  const e=document.getElementById("ce-"+mid);
  if(!e){editMaterialId=null;return;}
  const d=state.deadlines.find(x=>x.id===did);if(!d){editMaterialId=null;return;}
  const m=d.materials.find(x=>x.id===mid);if(!m){editMaterialId=null;return;}
  const v=e.value.trim();
  if(v)m.text=v;else d.materials=d.materials.filter(x=>x.id!==mid);
  const tEl=document.getElementById("ct-"+mid);
  if(tEl)m.target=tEl.value.trim();
  editMaterialId=null;save();render();
}

function moveMaterial(did,mid,dir){
  const d=state.deadlines.find(x=>x.id===did);if(!d)return;
  const i=d.materials.findIndex(x=>x.id===mid);
  const j=i+dir;
  if(i<0||j<0||j>=d.materials.length)return;
  const tmp=d.materials[i];d.materials[i]=d.materials[j];d.materials[j]=tmp;
  save();render();
}
function addMaterial(did){
  const d=state.deadlines.find(x=>x.id===did);if(!d)return;

function delMaterial(did,mid){

  d.materials=d.materials.filter(x=>x.id!==mid);save();render();
}

function drawCharts(){

  for(let i=0;i<=4;i++){const y=H-24-(H-40)*i/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-4,y);ctx.stroke();ctx.fillText((max*i/4).toFixed(1),pad-4,y+4);}
  days.forEach((d,i)=>{

function b64(buf){const b=new Uint8Array(buf);let s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function ub64(str){const bin=atob(str);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function deriveKey(pass,salt){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode(salt),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function sealState(pass,rev){
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  const iv=b64(crypto.getRandomValues(new Uint8Array(12)));
  const key=await deriveKey(pass,salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:ub64(iv)},key,new TextEncoder().encode(JSON.stringify(state)));
  return JSON.stringify({app:"studytrack",v:1,rev:rev,updatedAt:new Date().toISOString(),salt:salt,iv:iv,ct:b64(ct)});
}
async function openState(pass,payload){
  if(!payload||payload.app!=="studytrack")throw new Error("Dit is geen Study Track sync-bestand");
  const key=await deriveKey(pass,payload.salt);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(payload.iv)},key,ub64(payload.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function ghReq(method,url,body){
  const cfg=syncCfg();
  let r;
  try{
    r=await fetch(url,{method:method,headers:{"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  }catch(net){
    throw new Error("Geen verbinding met GitHub mogelijk (internet uit? VPN/firewall/antivirus blokkeert? Adres in veld 3 klopt niet?). Technisch: "+(net&&net.message?net.message:String(net)));
  }
  if(!r.ok){
    let why="";
    let gh="";
    try{const j=await r.json();gh=(j&&j.message)||"";}catch(e){}
    if(r.status===401)why=" (token ongeldig of verlopen)";
    else if(r.status===404)why=" (gist niet gevonden: check het Gist-ID)";
    else if(r.status===403)why=" (toegang geweigerd: token-rechten of limiet)";
    throw new Error("GitHub-fout "+r.status+why+(gh?" | GitHub zegt: "+gh:""));
  }
  return r.json();
}
async function syncVerifyToken(token){
  // Informele check: sommige geldige gist-only tokens krijgen hier 401/403 op /user,
  // terwijl de gist-endpoints prima werken. Daarom faalt dit nooit hard; de echte
  // gist-aanroepen hieronder geven de echte fouten (inclusief verkeerd token).
  try{
    const r=await fetch("https://api.github.com/user",{headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json"}});
    if(r.ok)return (await r.json()).login;
    return null;
  }catch(e){
    throw new Error("Geen verbinding met GitHub mogelijk (internet? of een blokkade door VPN/firewall/antivirus). Probeer het nog eens en anders even zonder VPN.");
  }
}
async function syncCreate(token,pass){

  const data=await ghReq("POST","https://api.github.com/gists",{description:"Study Track sync (versleuteld)",files:{"study-track-data.json":{content:payload}},public:false});
  syncSaveCfg({token:token,pass:pass,gistId:data.id,lastRevSeen:1,dirty:false,lastSync:new Date().toISOString()});
  saveRaw();

}
function cleanGistId(v){
  v=(v||"").trim();
  const m=v.match(/[0-9a-f]{32}|[0-9a-f]{40}|[0-9a-fA-F]{20,}/);
  if(m)return m[0];
  const parts=v.split("/");
  return parts[parts.length-1]||v;
}
async function syncConnect(token,gistId,pass){
  gistId=cleanGistId(gistId);
  await syncVerifyToken(token);
  syncSaveCfg({token:token,pass:pass,gistId:gistId});
  const raw=await ghReq("GET","https://api.github.com/gists/"+gistId);
  const files=raw.files||{};
  // voorkeur: ons eigen bestandsformaat, met welke naam dan ook
  let name=Object.keys(files).find(k=>{try{return JSON.parse(files[k].content).app==="studytrack";}catch(e){return false;}});
  if(!name){
    // lege/placeholder gist (zoals een handmatig aangemaakte testgist): adopteren en vullen
    if(Object.keys(files).length===1||Object.keys(files).length===0){
      name=Object.keys(files)[0]||"study-track-data.json";
      const payload=await sealState(pass,1);
      await ghReq("PATCH","https://api.github.com/gists/"+gistId,{files:{[name]:{content:payload}}});
      syncSaveCfg({token:token,pass:pass,gistId:gistId,fileName:name,lastRevSeen:1,dirty:false,lastSync:new Date().toISOString()});
      saveRaw();
      return true;
    }
    throw new Error("Deze gist bevat meerdere bestanden maar geen Study Track data. Maak een lege gist of plak het ID van een lege (1 bestand).");
  }
  syncSaveCfg({token:token,pass:pass,gistId:gistId,fileName:name});
  const payload=JSON.parse(files[name].content);
  const remote=await openState(pass,payload); // throws bij verkeerd wachtwoord
  applyRemote(remote,payload.rev||1);
  return true;
}
async function syncPush(){
  const cfg=syncCfg();

  const rev=(cfg.lastRevSeen||0)+1;
  const payload=await sealState(cfg.pass,rev);
  await ghReq("PATCH","https://api.github.com/gists/"+cfg.gistId,{files:{[cfg.fileName||"study-track-data.json"]:{content:payload}}});
  cfg.lastRevSeen=rev;cfg.dirty=false;cfg.lastSync=new Date().toISOString();syncSaveCfg(cfg);
}
async function syncPullRaw(){
  const cfg=syncCfg();
  if(!cfg.token||!cfg.gistId)return null;
  const data=await ghReq("GET","https://api.github.com/gists/"+cfg.gistId);
  const files=data.files||{};
  const name=cfg.fileName||Object.keys(files).find(k=>k==="study-track-data.json")||Object.keys(files).find(k=>{try{return JSON.parse(files[k].content).app==="studytrack";}catch(e){return false;}});
  if(!name)return null;
  const rawc=files[name]&&files[name].content;
  if(!rawc)return null;
  return JSON.parse(rawc);
}

async function syncNow(silent){
  const cfg=syncCfg();
  if(!cfg.token||!cfg.gistId||!cfg.pass){if(!silent)go("sync");return;}
  if(!silent)syncBusy("Synchroniseren met GitHub...");
  try{
    const payload=await syncPullRaw();
    if(!payload){await syncPush();if(!silent)syncOk("Lege gist gevuld met jouw data");return;}
    const R=payload.rev||1;
    const remote=await openState(cfg.pass,payload);
    const dirty=!!cfg.dirty;
    if(R>(cfg.lastRevSeen||0)){
      if(dirty){
        if(silent){await syncPush();}
        else if(confirm("Er zijn wijzigingen op dit apparaat EN in de cloud.\n\nOK = cloud overschrijven met dit apparaat\nAnnuleren = cloud laden (lokale wijzigingen gaan dan weg)")){
          await syncPush();syncOk("Cloud overschreven met dit apparaat");
        }else{
          applyRemote(remote,R);syncOk("Cloud geladen; lokale wijzigingen zijn verworpen");
        }
      }else{
        applyRemote(remote,R);
        if(!silent)syncOk("Bijgewerkt vanuit de cloud");
      }
    }else if(dirty){
      await syncPush();
      if(!silent)syncOk("Verzonden naar de cloud");
    }else{
      cfg.lastSync=new Date().toISOString();syncSaveCfg(cfg);
      if(!silent)syncOk("Alles is al up-to-date");
    }
  }catch(e){
    if(!silent)syncErr(e.message||String(e));
  }
}

  setTimeout(async()=>{try{
    const payload=await syncPullRaw();if(!payload)return;
    const R=payload.rev||1;
    if(R>(cfg.lastRevSeen||0)&&!cfg.dirty){
      const remote=await openState(cfg.pass,payload);
      applyRemote(remote,R);
    }
  }catch(e){}},1500);
})();
</script>
